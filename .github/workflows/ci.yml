name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests and soft-reboot lifecycle
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 26.04 ships the documented toolchain (Arm GNU Toolchain
      # 14.2.rel1, newlib 4.5.0) as gcc-arm-none-eabi, so no extra action is
      # needed to pin the compiler.
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 dosfstools mtools \
            gcc-arm-none-eabi libnewlib-dev libnewlib-arm-none-eabi qemu-user
          arm-none-eabi-gcc --version | head -1
      # Host checks: 32-bit time, output-pointer guards, termios/termcap,
      # memory-layout and volume-tool unit tests. No SDK, no board.
      - name: Host checks
        run: sh tests/run.sh
      # The same host checks rebuilt with the sanitizers, which catch
      # out-of-bounds access and undefined behaviour the plain build misses.
      - name: Host checks under ASan/UBSan
        env:
          HOST_TEST_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: sh tests/run.sh
      # The ARM/newlib session implementation exercised under qemu-user.
      - name: Soft-reboot lifecycle
        run: bash tests/soft/run.sh

  sdk-build:
    name: SDK build, memory budgets and images
    runs-on: ubuntu-26.04
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 git \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            dosfstools mtools libusb-1.0-0-dev pkg-config
      - name: Cache Pico SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-2.3.1-tinyusb
      - name: Fetch Pico SDK 2.3.1
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --branch 2.3.1 --depth 1 \
            https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb
      # Needs the SDK's FatFs headers; exercises the shared cwd/pathconf
      # wrappers in src/fileio.c.
      - name: Fileio path and pathconf checks
        run: python3 tests/test-fileio-paths.py
      # The fixture's own build enforces flash/SRAM/heap/stack budgets and
      # host/target layout probes via tools/check-memory.py.
      - name: Build integration fixture and volume
        run: |
          cmake -S tests/integration -B build/integration -G Ninja
          cmake --build build/integration --parallel "$(nproc)"
          cmake --build build/integration --target volume
      - name: Build hello recipe
        run: sh applications/hello/build.sh

  picolibc-probe:
    name: Picolibc compatibility probe
    # Tracks how far a picolibc port is from building. picolibc is the
    # arm-none-eabi C library in current distributions (Ubuntu 26.10, Debian
    # sid) and dropped newlib's reentrant API that the soft-reboot session
    # core uses, so this compile is expected to fail; a success is the
    # milestone signal. Informational only, and main only, so it never gates
    # a pull request. See PICOLIBC.md.
    if: github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-26.04
    container: ubuntu:26.10
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git gcc-arm-none-eabi picolibc-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
      - uses: actions/checkout@v4
      - name: Probe the session core against picolibc
        id: probe
        continue-on-error: true
        run: sh tests/picolibc-probe.sh
      # The probe is expected to fail while the port is unstarted; surface the
      # opposite outcome, since that is what needs attention.
      - name: Report probe outcome
        run: |
          if [ "${{ steps.probe.outcome }}" = "success" ]; then
            echo "::warning::picolibc probe: the session core now compiles - the port may be feasible"
          else
            echo "picolibc probe: session core does not compile against picolibc (expected; see PICOLIBC.md)"
          fi
